<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title></title>
    <link href="css/StyleDefult.css" rel="stylesheet" type="text/css" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/lightbox.min.css" rel="stylesheet" />

    <script type="text/javascript" src="cordova.js"></script>
    <script src="scripts/vuejs.js"></script>
    <script src="scripts/jquery-3.3.1.js"></script>
    <script src="scripts/listener.js"></script>
    <script src="scripts/database.js"></script>
    <script src="scripts/blokozet.js"></script>
    <script src="scripts/axiosjs.js"></script>
    <style>
        td {
            padding: 5px
        }
    </style>
        <script type="text/javascript">
            if (window.localStorage["userGuid"] == "" || window.localStorage["userGuid"] == undefined) {
                    window.location.href = "Login.html";
            }

            $(document).ready(function () {
                updateConnectionProperties();
                //window.history.forward(1);
                window.history.pushState(null, "", window.location.href);
                window.onpopstate = function () {
                    window.history.pushState(null, "", window.location.href);
                };
            })
    </script>
</head>
<body>
    <div id="blokozet"  v-cloak>
        <table style="width:100%">
            <tr>
                <td>

                    <input type="button" id="btnWebService" value="Blok Yükle" @click="btnWebService()"/>

                    <input type="button" id="btnSendOffline" value="Datayı Gönder" @click="sendOfflineData('button')" />
                    <input type="button" id="btnSendOffline" value="Tüm Datayı Gönder" @click="sendData('1=1')" />
                </td>
                <td>
                    <div>Toplam: <span id="spanToplam" style="font-weight:bold;color:red">{{gonderimsayisi}}</span></div>
                </td>
                <td><div>Gönderilen : </div></td>
                <td> <span id="spanGonderilen" style="font-weight:bold;color:yellowgreen">{{gonderilen}}</span></td>
                <td style="text-align:right;">
                    <button type="button" class="btn btn-warning btn-sm" id="brightnessBtn" style="margin-right:5px;" onclick="toggleBrightnessPanel()">☀ Parlaklık</button>
                    <input type="button" class="btn btn-danger btn-sm" value="Çıkış" onclick="window.location.href='Login.html';" />
                </td>
            </tr>
        </table>


        <table  id="tblListe" class="table table-striped" colspan="5" rowspan="5">
            <thead>
                <tr>
                    <!--
            blokYukle()
         -->
                    <th scope="col">Blok No</th>
                    <th scope="col">İl</th>
                    <th scope="col">İlçe</th>
                    <th scope="col">Köy</th>
                    <th scope="col">Mahalle</th>
                    <th scope="col">Durum</th>
                    <th scope="col">Tamamlanan</th>
                    <th scope="col">&nbsp;</th>

                    <th scope="col">İşlem</th>
    
                </tr>
                <tr v-for="item in liste" v-if="liste.length">
                    <td>{{item.blokno}}</td>
                    <td>{{item.iladi}}</td>
                    <td>{{item.ilceadi}}</td>
                    <td>{{item.koyadi}}</td>
                    <td>{{item.mahalleadi}}</td>
                    <td>{{item.blokAciklama}}</td>
                    <td>{{item.tamamlanan || 0}}</td>
                    <td>
                        <input v-if="item.statu==2" type='button' class='btn btn-block btn-warning btn-xs' value='Blok Aç' @click="blokAc(item.guid)" />
                        <input v-if="item.statu!=2 && item.statu!=8 && item.statu!=9" type='button' class='btn btn-block btn-outline-secondary btn-xs' value='Blok Kapat' @click="blokKapat(item.guid)" />
                        <span v-if="item.statu==8 || item.statu==9" type='button' class='btn btn-block btn-secondary btn-xs'>&nbsp;</span>
                    </td>
                    <td> 
                        <input type='button' class='btn btn-block btn-primary btn-xs' value='Blok Detayı' @click="blokDetay(item.guid)" />
                    </td>

                </tr>

            </thead>

        </table>

    </div>
    <!-- Parlaklık Paneli -->
    <div id="brightnessPanel" style="display:none;position:fixed;top:50px;right:10px;background:white;border-radius:10px;padding:15px;z-index:99998;box-shadow:0 4px 15px rgba(0,0,0,0.3);width:220px;">
        <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:16px;">🔅</span>
            <input type="range" id="brightnessRange" min="5" max="100" value="50" style="flex:1;">
            <span style="font-size:16px;">🔆</span>
        </div>
        <div style="text-align:center;margin-top:5px;font-size:12px;color:#666;">Parlaklık: <span id="brightnessPercent">50</span>%</div>
    </div>

    <script type="text/javascript">
        document.addEventListener("backbutton", function(e) {
            e.preventDefault();
            alert("Buradan Geriye Gidemezsiniz!");
        }, false);

        // Parlaklık panel aç/kapa
        var brightnessOpen = false;
        function toggleBrightnessPanel() {
            var panel = document.getElementById('brightnessPanel');
            if (brightnessOpen) {
                panel.style.display = 'none';
                brightnessOpen = false;
            } else {
                var saved = window.localStorage.getItem('brightness') || '50';
                document.getElementById('brightnessRange').value = saved;
                document.getElementById('brightnessPercent').textContent = saved;
                panel.style.display = 'block';
                brightnessOpen = true;
            }
        }

        document.addEventListener('deviceready', function() {
            var slider = document.getElementById('brightnessRange');
            if (slider) {
                slider.addEventListener('input', function() {
                    var val = parseInt(this.value);
                    document.getElementById('brightnessPercent').textContent = val;
                    var androidVal = val / 100.0;
                    window.localStorage.setItem('brightness', val);
                    if (window.cordova && cordova.exec) {
                        cordova.exec(null, null, 'KioskMode', 'setBrightness', [androidVal]);
                    }
                });
            }
        });

        // Panel dışına tıklayınca kapat
        document.addEventListener('click', function(e) {
            if (!brightnessOpen) return;
            var panel = document.getElementById('brightnessPanel');
            var btn = document.getElementById('brightnessBtn');
            if (panel && !panel.contains(e.target) && btn && !btn.contains(e.target)) {
                panel.style.display = 'none';
                brightnessOpen = false;
            }
        }, true);
    </script>
</body>
<style>
    [v-cloak] { display: none; }
  </style>
</html>
